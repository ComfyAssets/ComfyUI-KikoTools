name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements-dev.txt

    - name: Run full test suite and coverage gate
      run: python -m pytest tests --cov=kikotools --cov-report=term-missing

    - name: Extract release notes from CHANGELOG.md
      run: python scripts/changelog_section.py "$GITHUB_REF_NAME" > release_notes.md

    - name: Create release or attach files to the existing one
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # A release made by hand keeps its name and notes; only files are added.
        if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "KikoTools ${GITHUB_REF_NAME#v}" \
            --notes-file release_notes.md
        fi
        gh release upload "$GITHUB_REF_NAME" --clobber \
          README.md LICENSE requirements-dev.txt examples/workflows/*.json
